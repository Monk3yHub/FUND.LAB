name: Update Daily NAV

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/update-nav.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}

          - name: Sync Funds List from SEC
  run: node scripts/sync-funds.mjs
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    SEC_API_KEY: ${{ secrets.SEC_API_KEY }}

- name: Update Daily NAV
  run: node scripts/update-nav.mjs
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
