import { createClient } from '@supabase/supabase-js';

const SUPABASE_URL = process.env.SUPABASE_URL;
const SUPABASE_SERVICE_KEY = process.env.SUPABASE_SERVICE_KEY;
const SEC_API_KEY = process.env.SEC_API_KEY;

if (!SUPABASE_URL || !SUPABASE_SERVICE_KEY) {
  console.error('❌ Missing SUPABASE_URL or SUPABASE_SERVICE_KEY in environment variables.');
  process.exit(1);
}

const supabase = createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
const isYtdMode = process.argv.includes('--ytd');

console.log(`🚀 Starting NAV Sync Script [Mode: ${isYtdMode ? 'YTD' : 'Daily'}]`);

function getDateRange() {
  const today = new Date();
  const endDate = today.toISOString().split('T')[0];

  let startDate;
  if (isYtdMode) {
    startDate = `${today.getFullYear()}-01-01`;
  } else {
    const d = new Date();
    d.setDate(d.getDate() - 7); // ย้อนหลัง 7 วันเพื่อเก็บตกวันหยุด
    startDate = d.toISOString().split('T')[0];
  }
  return { startDate, endDate };
}

async function fetchSecNavData(fundCode, startDate, endDate) {
  const url = `https://api.sec.or.th/FundDailyInfo/${encodeURIComponent(fundCode)}/NAV/daily/${startDate}/${endDate}`;
  try {
    const response = await fetch(url, {
      method: 'GET',
      headers: {
        'Ocp-Apim-Subscription-Key': SEC_API_KEY || '',
        'Content-Type': 'application/json',
      },
    });

    if (!response.ok) return [];
    const data = await response.json();
    return Array.isArray(data) ? data : [];
  } catch (err) {
    console.warn(`  ⚠️ API Fetch Warning for ${fundCode}:`, err.message);
    return [];
  }
}

async function main() {
  try {
    // 1. ดึงรายชื่อกองทุนทั้งหมดใน DB
    const { data: funds, error: fundErr } = await supabase.from('funds').select('*');

    if (fundErr || !funds || funds.length === 0) {
      console.error('❌ Cannot fetch funds table or table is empty:', fundErr?.message);
      process.exit(1);
    }

    const { startDate, endDate } = getDateRange();
    console.log(`📅 Date Range: ${startDate} to ${endDate} | Total Funds: ${funds.length}`);

    for (const fund of funds) {
      // รองรับคอลัมน์ code หรือ fund_code
      const fundCode = fund.code || fund.fund_code;
      if (!fundCode) continue;

      console.log(`\n🔍 Syncing NAV for: ${fundCode}`);
      const secNavList = await fetchSecNavData(fundCode, startDate, endDate);

      if (secNavList.length === 0) {
        console.warn(`  ⚠️ No data returned from SEC for: ${fundCode}`);
        continue;
      }

      // 2. Strict Exact Match (ตรง Class 100%)
      const validNavRecords = [];
      for (const item of secNavList) {
        const secClassCode = item.proj_abbr_name ? item.proj_abbr_name.trim().toUpperCase() : '';
        const targetCode = fundCode.trim().toUpperCase();

        if (secClassCode === targetCode && item.nav != null) {
          validNavRecords.push({
            fund_code: fundCode,
            nav_date: item.nav_date,
            nav: parseFloat(item.nav),
            updated_at: new Date().toISOString()
          });
        }
      }

      if (validNavRecords.length === 0) {
        console.warn(`  ⚠️ No exact class match for '${fundCode}'. Skipped.`);
        continue;
      }

      // 3. Upsert ลง nav_history
      const { error: historyErr } = await supabase
        .from('nav_history')
        .upsert(validNavRecords, { onConflict: 'fund_code,nav_date' });

      if (historyErr) {
        console.error(`  ❌ Failed to save nav_history for ${fundCode}:`, historyErr.message);
      } else {
        console.log(`  ✅ Saved ${validNavRecords.length} records to nav_history.`);
      }

      // 4. Update NAV ล่าสุด
      const latestRecord = validNavRecords.sort((a, b) => new Date(b.nav_date) - new Date(a.nav_date))[0];
      if (latestRecord) {
        await supabase
          .from('funds')
          .update({
            last_nav: latestRecord.nav,
            last_nav_date: latestRecord.nav_date,
            updated_at: new Date().toISOString()
          })
          .match({ code: fundCode })
          .catch(() => {});
      }
    }
    console.log('\n🎉 NAV Sync completed successfully!');
  } catch (globalErr) {
    console.error('❌ Global script error:', globalErr.message);
    process.exit(1);
  }
}

main();
