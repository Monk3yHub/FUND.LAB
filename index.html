<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fund Portfolio Challenge</title>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --text:#1a1d29; --sub:#6b7280; --accent:#5b5bd6; --accent2:#00b894; --danger:#e74c3c; --border:#e5e7eb; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;padding:16px;}
  header h1{margin:0;font-size:17px;}
  main{max-width:520px;margin:0 auto;padding:14px;padding-bottom:60px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .tabs{display:flex;gap:6px;padding:10px 12px 0;background:var(--accent);}
  .tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);cursor:pointer;}
  .tab.active{background:var(--bg);color:var(--accent);}
  input[type=number]{width:90px;padding:6px;border-radius:8px;border:1px solid var(--border);text-align:right;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--border);}
  .right{text-align:right;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.small{padding:6px 9px;font-size:12px;background:var(--danger);}
  .fund-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;}
  .rank-row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;}
  .you{background:rgba(91,91,214,.08);border-radius:8px;}
  .balance{font-size:22px;font-weight:800;}
  .loading{color:var(--sub);text-align:center;padding:20px;}
</style>
</head>
<body>
<header>
  <h1>🏆 Fund Portfolio Challenge</h1>
  <p id="whoami" style="margin:4px 0 0;font-size:12px;opacity:.85;">กำลังเข้าสู่ระบบผ่าน LINE...</p>
</header>
<div class="tabs">
  <div class="tab active" data-tab="build">จัดพอร์ต</div>
  <div class="tab" data-tab="board">อันดับ</div>
</div>
<main>
  <section id="tab-build">
    <div class="card">
      <h2 style="font-size:14px;">เลือกกองทุน</h2>
      <input type="text" id="search" placeholder="พิมพ์รหัสหรือชื่อกองทุน (เช่น KTWC, ONE, K-)" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);">
      <div id="fundList" style="margin-top:8px;max-height:220px;overflow-y:auto;"></div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;">พอร์ตของฉัน (วงเงิน 1,000,000 บาท)</h2>
      <table><thead><tr><th>กองทุน</th><th class="right">จำนวนเงิน</th><th></th></tr></thead>
      <tbody id="portfolioBody"></tbody></table>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
        <div><div style="font-size:11px;color:var(--sub);">คงเหลือ</div><div class="balance" id="balance">1,000,000</div></div>
        <button class="btn" id="submitBtn">✅ ยืนยันพอร์ต</button>
      </div>
    </div>
  </section>
  <section id="tab-board" style="display:none;">
    <div class="card"><div id="leaderboard" class="loading">กำลังโหลด...</div></div>
  </section>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ============ 3 ค่าเดิมของคุณ ============
const LIFF_ID = "2011677026-ti2t0BRg";
const SUPABASE_URL = "https://njtxoohmhhvskxjqovps.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdHhvb2htaGh2c2t4anFvdnBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTE2MzcsImV4cCI6MjEwNTU2NzYzN30.54Cea7ALG0-xzieBLUl0B0WOIcsIoRL1hoaDhc846wA";
// ==========================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const START_CASH = 1000000;

let lineUserId = null, nickname = "";
let FUNDS = [];             // [{code, name, nav}]
let portfolio = {};         // code -> amount
let searchTimeout = null;

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function pct(n){ return (n*100).toFixed(2)+"%"; }

async function boot(){
  await liff.init({ liffId: LIFF_ID });
  if(!liff.isLoggedIn()){ liff.login(); return; }

  const profile = await liff.getProfile();
  lineUserId = profile.userId;
  nickname = profile.displayName;
  document.getElementById('whoami').textContent = "สวัสดีคุณ " + nickname;

  await supabase.from('players').upsert(
    { line_user_id: lineUserId, nickname },
    { onConflict: 'line_user_id' }
  );

  loadFunds();
  await loadPortfolio();
  await loadLeaderboard();
}

// ---------- ระบบค้นหากองทุน (Server-side Search ค้นได้ทั้ง 8,000+ กองทุน) ----------
function loadFunds(){
  document.getElementById('fundList').innerHTML = '<div class="loading">พิมพ์รหัสหรือชื่อกองทุนเพื่อค้นหา</div>';
}

document.getElementById('search').oninput = (e) => {
  clearTimeout(searchTimeout);
  const query = e.target.value.trim();
  
  if (!query) {
    document.getElementById('fundList').innerHTML = '<div class="loading">พิมพ์รหัสหรือชื่อกองทุนเพื่อค้นหา</div>';
    return;
  }
  
  // Debounce 300ms ชะลอการส่ง request ขณะพิมพ์
  searchTimeout = setTimeout(() => searchFunds(query), 300);
};

async function searchFunds(query) {
  const list = document.getElementById('fundList');
  list.innerHTML = '<div class="loading">กำลังค้นหา...</div>';

  const f = query.toUpperCase();

  // ยิงตรงไปค้นหาในตาราง funds บน Supabase ไม่ติด limit 1,000 แถว
  const { data: funds, error } = await supabase
    .from('funds')
    .select('code, name')
    .or(`code.ilike.%${f}%,name.ilike.%${f}%`)
    .limit(20);

  if (error || !funds || funds.length === 0) {
    list.innerHTML = '<div class="loading">ไม่พบกองทุน</div>';
    return;
  }

  // ดึง NAV เฉพาะของกองทุนที่ค้นพบ
  const fundCodes = funds.map(x => x.code);
  const { data: navs } = await supabase
    .from('latest_nav')
    .select('fund_code, nav')
    .in('fund_code', fundCodes);

  const navMap = Object.fromEntries((navs || []).map(n => [n.fund_code, n.nav]));

  list.innerHTML = funds.map(fund => `
    <div class="fund-item">
      <div><b>${fund.code}</b> · NAV ${navMap[fund.code] ?? '-'}<br><span style="color:var(--sub);font-size:11px;">${fund.name}</span></div>
      <button class="btn small" style="background:var(--accent)" data-add="${fund.code}" data-nav="${navMap[fund.code] ?? ''}">+ เพิ่ม</button>
    </div>`).join('');

  list.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = () => {
      const code = b.dataset.add;
      const navVal = b.dataset.nav ? parseFloat(b.dataset.nav) : null;
      
      portfolio[code] ??= 0;
      
      const existing = FUNDS.find(x => x.code === code);
      if (!existing) {
        FUNDS.push({ code, nav: navVal });
      } else {
        existing.nav = navVal;
      }
      
      renderPortfolio();
    };
  });
}

// ---------- Portfolio builder ----------
async function loadPortfolio(){
  const { data } = await supabase.from('holdings').select('fund_code,amount,units').eq('player_line_user_id', lineUserId);
  
  // โหลด NAV ของกองทุนที่มีอยู่ในพอร์ตเดิมขึ้นมาด้วย
  if (data && data.length > 0) {
    const codes = data.map(h => h.fund_code);
    const { data: navs } = await supabase.from('latest_nav').select('fund_code,nav').in('fund_code', codes);
    const navMap = Object.fromEntries((navs||[]).map(n=>[n.fund_code, n.nav]));
    
    codes.forEach(c => {
      if (!FUNDS.find(x => x.code === c)) {
        FUNDS.push({ code: c, nav: navMap[c] ?? null });
      }
    });
  }

  portfolio = Object.fromEntries((data||[]).map(h => [h.fund_code, h.amount]));
  renderPortfolio();
}

function renderPortfolio(){
  const body = document.getElementById('portfolioBody');
  body.innerHTML = Object.keys(portfolio).map(code => `
    <tr>
      <td><b>${code}</b></td>
      <td class="right"><input type="number" min="0" step="1000" value="${portfolio[code]}" data-amt="${code}"></td>
      <td class="right"><button class="btn small" data-del="${code}">×</button></td>
    </tr>`).join('');
  body.querySelectorAll('[data-amt]').forEach(inp => inp.oninput = () => { portfolio[inp.dataset.amt] = Number(inp.value)||0; updateBalance(); });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { delete portfolio[b.dataset.del]; renderPortfolio(); });
  updateBalance();
}

function updateBalance(){
  const used = Object.values(portfolio).reduce((s,a)=>s+a,0);
  const el = document.getElementById('balance');
  el.textContent = fmt(START_CASH - used);
  el.style.color = (START_CASH - used) < 0 ? 'var(--danger)' : '';
}

document.getElementById('submitBtn').onclick = async () => {
  const used = Object.values(portfolio).reduce((s,a)=>s+a,0);
  if(used === 0 || used > START_CASH){ alert("เช็ควงเงินให้ถูกต้องก่อน (0 < ยอดรวม ≤ 1,000,000)"); return; }

  await supabase.from('holdings').delete().eq('player_line_user_id', lineUserId);
  
  const navMap = Object.fromEntries(FUNDS.map(f => [f.code, f.nav]));
  const rows = Object.entries(portfolio)
    .filter(([, amt]) => amt > 0)
    .map(([code, amt]) => ({
      player_line_user_id: lineUserId,
      fund_code: code,
      amount: amt,
      units: navMap[code] ? amt / navMap[code] : 0,
    }));
    
  const { error } = await supabase.from('holdings').insert(rows);
  if(error){ alert("บันทึกไม่สำเร็จ: " + error.message); return; }
  alert("บันทึกพอร์ตเรียบร้อย!");
  loadLeaderboard();
};

// ---------- Leaderboard ----------
async function loadLeaderboard(){
  const box = document.getElementById('leaderboard');
  box.innerHTML = '<div class="loading">กำลังโหลด...</div>';

  const [{ data: allPlayers }, { data: allHoldings }, { data: navs }] = await Promise.all([
    supabase.from('players').select('line_user_id,nickname'),
    supabase.from('holdings').select('player_line_user_id,fund_code,amount,units'),
    supabase.from('latest_nav').select('fund_code,nav'),
  ]);
  const navMap = Object.fromEntries((navs||[]).map(n=>[n.fund_code, n.nav]));

  const rows = (allPlayers||[]).map(p => {
    const holdings = (allHoldings||[]).filter(h => h.player_line_user_id === p.line_user_id);
    if(holdings.length===0) return null;
    let invested = 0, current = 0;
    holdings.forEach(h => {
      invested += h.amount;
      const nav = navMap[h.fund_code];
      current += nav ? h.units * nav : h.amount;
    });
    const ret = invested ? (current - invested) / invested : 0;
    return { name: p.nickname, ret, invested, current };
  }).filter(Boolean).sort((a,b) => b.ret - a.ret);

  box.innerHTML = rows.length ? rows.map((r,i) => `
    <div class="rank-row ${r.name===nickname?'you':''}">
      <div>${i+1}. <b>${r.name}</b></div>
      <div>ผลตอบแทน <b>${pct(r.ret)}</b></div>
    </div>`).join('') : '<div class="loading">ยังไม่มีผู้เล่นส่งพอร์ต</div>';
}

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('tab-build').style.display = name==='build' ? '' : 'none';
    document.getElementById('tab-board').style.display = name==='board' ? '' : 'none';
    if(name==='board') loadLeaderboard();
  };
});

boot();
</script>
</body>
</html>
