<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fund Challenge - โหมดฝึกซ้อม</title>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --text:#1a1d29; --sub:#6b7280; --accent:#5b5bd6; --danger:#e74c3c; --border:#e5e7eb; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;padding:16px;}
  header h1{margin:0;font-size:17px;}
  main{max-width:520px;margin:0 auto;padding:14px;padding-bottom:60px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  input[type=number]{width:75px;padding:6px;border-radius:8px;border:1px solid var(--border);text-align:right;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--border);}
  .right{text-align:right;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.small{padding:6px 9px;font-size:12px;background:var(--danger);}
  .fund-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;}
  .summary-box{background:rgba(91,91,214,.08);padding:12px;border-radius:10px;margin-top:10px;}
  .loading{color:var(--sub);text-align:center;padding:20px;}
</style>
</head>
<body>
<header>
  <h1>🎮 Fund Challenge (โหมดฝึกซ้อม)</h1>
  <p id="whoami" style="margin:4px 0 0;font-size:12px;opacity:.85;">กำลังเข้าสู่ระบบผ่าน LINE...</p>
</header>
<main>
  <div class="card">
    <h2 style="font-size:14px;">ค้นหากองทุน</h2>
    <input type="text" id="search" placeholder="พิมพ์รหัสหรือชื่อกองทุน..." style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);">
    <div id="fundList" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
  </div>

  <div class="card">
    <h2 style="font-size:14px;">พอร์ตฝึกซ้อม (วงเงินจำลอง 1,000,000 บาท)</h2>
    <table>
      <thead>
        <tr>
          <th>กองทุน</th>
          <th class="right">สัดส่วน (%)</th>
          <th class="right">คิดเป็นเงิน (บาท)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="portfolioBody"></tbody>
    </table>

    <div class="summary-box">
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span>สัดส่วนรวม: <b id="totalPct">0%</b></span>
        <span>มูลค่ารวม: <b id="totalValue">0</b> บาท</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px;">
        <span>ผลตอบแทนปัจจุบัน: <b id="totalReturn" style="color:var(--accent);">0.00%</b></span>
      </div>
    </div>

    <button class="btn" id="submitBtn" style="width:100%;margin-top:12px;">✅ บันทึกพอร์ตฝึกซ้อม</button>
  </div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ==========================================
// 🔑 ข้อมูล Key และ ID ของคุณ (ใส่ให้เรียบร้อยแล้ว)
// ==========================================
const LIFF_ID = "2011677026-ti2t0BRg"; 
const SUPABASE_URL = "https://njtxoohmhhvskxjqovps.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdHhvb2htaGh2c2t4anFvdnBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTE2MzcsImV4cCI6MjEwNTU2NzYzN30.54Cea7ALG0-xzieBLUl0B0WOIcsIoRL1hoaDhc846wA";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CAPITAL = 1000000;

let lineUserId = null, nickname = "";
let portfolio = {}; // fund_code -> pct
let FUNDS = [];
let searchTimeout = null;

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

async function boot(){
  await liff.init({ liffId: LIFF_ID });
  if(!liff.isLoggedIn()){ liff.login(); return; }

  const profile = await liff.getProfile();
  lineUserId = profile.userId;
  nickname = profile.displayName;
  document.getElementById('whoami').textContent = "สวัสดีคุณ " + nickname;

  await supabase.from('players').upsert({ line_user_id: lineUserId, nickname }, { onConflict: 'line_user_id' });
  loadFunds();
  await loadPortfolio();
}

function loadFunds(){
  document.getElementById('fundList').innerHTML = '<div class="loading">พิมพ์รหัสหรือชื่อกองทุนเพื่อค้นหา</div>';
}

document.getElementById('search').oninput = (e) => {
  clearTimeout(searchTimeout);
  const query = e.target.value.trim();
  if (!query) { loadFunds(); return; }
  searchTimeout = setTimeout(() => searchFunds(query), 300);
};

async function searchFunds(query) {
  const list = document.getElementById('fundList');
  list.innerHTML = '<div class="loading">กำลังค้นหา...</div>';
  const f = query.toUpperCase();

  const { data: funds } = await supabase.from('funds').select('code, name').or(`code.ilike.%${f}%,name.ilike.%${f}%`).limit(20);
  if (!funds || funds.length === 0) { list.innerHTML = '<div class="loading">ไม่พบกองทุน</div>'; return; }

  const fundCodes = funds.map(x => x.code);
  const { data: navs } = await supabase.from('latest_nav').select('fund_code, nav').in('fund_code', fundCodes);
  const navMap = Object.fromEntries((navs || []).map(n => [n.fund_code, n.nav]));

  list.innerHTML = funds.map(fund => `
    <div class="fund-item">
      <div><b>${fund.code}</b> · NAV ${navMap[fund.code] ?? '-'}<br><span style="color:var(--sub);font-size:11px;">${fund.name}</span></div>
      <button class="btn small" style="background:var(--accent)" data-add="${fund.code}" data-nav="${navMap[fund.code] ?? ''}">+ เลือก</button>
    </div>`).join('');

  list.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = () => {
      const code = b.dataset.add;
      const navVal = b.dataset.nav ? parseFloat(b.dataset.nav) : null;
      portfolio[code] ??= 0;
      if (!FUNDS.find(x => x.code === code)) FUNDS.push({ code, nav: navVal });
      renderPortfolio();
    };
  });
}

async function loadPortfolio(){
  const { data } = await supabase.from('holdings').select('fund_code, amount, units').eq('player_line_user_id', lineUserId);
  if (data && data.length > 0) {
    const codes = data.map(h => h.fund_code);
    const { data: navs } = await supabase.from('latest_nav').select('fund_code, nav').in('fund_code', codes);
    const navMap = Object.fromEntries((navs||[]).map(n=>[n.fund_code, n.nav]));
    codes.forEach(c => {
      if (!FUNDS.find(x => x.code === c)) FUNDS.push({ code: c, nav: navMap[c] ?? null });
    });
    portfolio = Object.fromEntries(data.map(h => [h.fund_code, (h.amount / CAPITAL) * 100]));
  }
  renderPortfolio();
}

function renderPortfolio(){
  const body = document.getElementById('portfolioBody');
  body.innerHTML = Object.keys(portfolio).map(code => {
    const pct = portfolio[code];
    const baht = (pct / 100) * CAPITAL;
    return `
      <tr>
        <td><b>${code}</b></td>
        <td class="right"><input type="number" min="0" max="100" step="5" value="${pct}" data-pct="${code}"> %</td>
        <td class="right">${fmt(baht)}</td>
        <td class="right"><button class="btn small" data-del="${code}">×</button></td>
      </tr>`;
  }).join('');

  body.querySelectorAll('[data-pct]').forEach(inp => inp.oninput = () => { portfolio[inp.dataset.pct] = Number(inp.value)||0; updateSummary(); });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { delete portfolio[b.dataset.del]; renderPortfolio(); });
  updateSummary();
}

function updateSummary(){
  const totalPct = Object.values(portfolio).reduce((s,a)=>s+a,0);
  const totalBaht = (totalPct / 100) * CAPITAL;
  
  document.getElementById('totalPct').textContent = totalPct + "%";
  document.getElementById('totalPct').style.color = totalPct !== 100 ? 'var(--danger)' : 'var(--accent)';
  document.getElementById('totalValue').textContent = fmt(totalBaht);

  let currentVal = 0;
  Object.entries(portfolio).forEach(([code, pct]) => {
    const f = FUNDS.find(x => x.code === code);
    const costBaht = (pct / 100) * CAPITAL;
    if (f && f.nav) {
      const units = costBaht / f.nav;
      currentVal += units * f.nav;
    } else {
      currentVal += costBaht;
    }
  });

  const retPct = totalBaht > 0 ? ((currentVal - totalBaht) / totalBaht) * 100 : 0;
  document.getElementById('totalReturn').textContent = retPct.toFixed(2) + "%";
}

document.getElementById('submitBtn').onclick = async () => {
  const totalPct = Object.values(portfolio).reduce((s,a)=>s+a,0);
  if(totalPct !== 100){ alert("สัดส่วนรวมต้องเท่ากับ 100% พอดี (ปัจจุบัน " + totalPct + "%)"); return; }

  await supabase.from('holdings').delete().eq('player_line_user_id', lineUserId);
  
  const navMap = Object.fromEntries(FUNDS.map(f => [f.code, f.nav]));
  const rows = Object.entries(portfolio)
    .filter(([, pct]) => pct > 0)
    .map(([code, pct]) => {
      const amount = (pct / 100) * CAPITAL;
      return {
        player_line_user_id: lineUserId,
        fund_code: code,
        amount: amount,
        units: navMap[code] ? amount / navMap[code] : 0,
      };
    });
    
  const { error } = await supabase.from('holdings').insert(rows);
  if(error){ alert("บันทึกไม่สำเร็จ: " + error.message); return; }
  alert("บันทึกพอร์ตฝึกซ้อมเรียบร้อย!");
};

boot();
</script>
</body>
</html>
